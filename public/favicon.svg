<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="quarkspace">
  <rect width="32" height="32" rx="4.5" fill="#f4f3ee"/>
  <!-- The Q: a ring with a gap. dasharray sums to the circumference (2π·9.6 = 60.3), so the gap is
       11% of it — small enough to still read as a ring, wide enough to read as a Q at 16px. -->
  <circle cx="16" cy="15.4" r="9.6" fill="none" stroke="#1b2430" stroke-width="4.6"
          stroke-dasharray="53.5 6.8" transform="rotate(46 16 15.4)"/>
  <path d="M17.2 16.6 L24.6 24" stroke="#1b2430" stroke-width="4.8" stroke-linecap="butt"/>
  <path d="M23.6 23 L26.6 26" stroke="#d99a1e" stroke-width="4.8" stroke-linecap="round"/>
</svg>
