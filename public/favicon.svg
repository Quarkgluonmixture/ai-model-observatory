<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18212b"/>
      <stop offset="0.55" stop-color="#1d2732"/>
      <stop offset="1" stop-color="#151d26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c69416"/>
      <stop offset="0.5" stop-color="#d0a626"/>
      <stop offset="1" stop-color="#b98510"/>
    </linearGradient>
  </defs>

  <!-- paper-white background -->
  <rect width="1254" height="1254" fill="#f7f5ef"/>

  <!-- Q / measuring ring. stroke-width 70 -> 100: 70 renders 0.89px at 16px, which is under one
       device pixel and greys out. 100 gives 1.28px. The dasharray still sums to the circumference
       (2π·284 = 1785), so the opening that makes this a Q is unchanged. -->
  <circle cx="625" cy="579" r="284"
          fill="none" stroke="url(#ink)" stroke-width="100"
          stroke-linecap="butt"
          stroke-dasharray="1586 198"
          transform="rotate(43 625 579)"/>

  <!-- Q tail -->
  <path d="M 698 676 L 764 676 L 880 792 L 838 834 Z"
        fill="url(#ink)"/>

  <!-- gold nib / arrow tip -->
  <path d="M 852 842 L 894 800 L 952 894 Z"
        fill="url(#gold)"/>

  <!-- crosshair ticks, 12 -> 24 thick, lengths and positions unchanged and re-centred on the ring
       centre (625, 579). Twice the weight still only buys 0.31px at 16px, so these are for 32px and
       up; see the layout comment in app/layout.tsx. -->
  <rect x="613" y="362" width="24" height="64" fill="url(#gold)"/>
  <rect x="613" y="740" width="24" height="64" fill="url(#gold)"/>
  <rect x="405" y="567" width="65" height="24" fill="url(#gold)"/>
  <rect x="777" y="567" width="65" height="24" fill="url(#gold)"/>

  <!-- central four-point sparkle -->
  <path d="M 625 522
           C 632 548, 646 569, 683 579
           C 646 588, 632 610, 625 638
           C 617 610, 603 588, 566 579
           C 603 569, 617 548, 625 522 Z"
        fill="url(#gold)"/>
</svg>
