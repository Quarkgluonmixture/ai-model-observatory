name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, data contract, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Two commits, so a push to main can be diffed against its parent. That diff is what
          # decides the one notification this project sends on a good day — see the last step.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rebuild observations from the archive
        run: npm run ingest

      - name: Fail if the generated observations drift from the archive
        run: git diff --exit-code app/observations.generated.ts

      - name: Validate benchmark data contract
        run: npm run check:data

      - name: Audit model catalog against the source archive
        run: npm run check:models

      - name: Fail on a quoted price that has outlived its published end date
        run: npm run check:prices

      # The attribution gate decides which model a published string belongs to, unattended. Its
      # test set is the decisions a human already made: a rule change that starts contradicting
      # one of them, or that starts mapping a string somebody deliberately refused, fails here
      # rather than shipping a wrong score under the right model's name.
      - name: Replay the attribution gate against every human decision
        run: npm run propose:attribution -- --backtest

      # The backtest can only measure the gate against events that already happened, and the fifth
      # refusal exists for one that has not: a maker dating a re-trained release under a slug some
      # board never renames. So that scenario is simulated, in both directions — a dated sibling
      # sharing no cell must refuse, an agreeing one must not. Without this, a refactor that drops
      # the rule reads as five points of RECOVERED reproduction in the line above and looks like a
      # win.
      - name: Replay the dated-release refusal against a simulated GA slug
        run: npm run propose:attribution -- --self-test

      # Two classifiers decide, unattended, which upstream rows count as evidence and which upstream
      # names are models at all — and both used to be self-tests somebody had to remember to run.
      # That is the shape `check:mobile` had until 2026-08-07, and it rotted the same way: a comment
      # quoted "89% recovery, 0 over-counts" for weeks while the real numbers were 70% and 1.
      #
      # What each one fails on is narrow on purpose. The evidence counter fails on an over-count that
      # is not pinned with a reason (that is how a model gets over the dilution floor on another
      # model's rows, and `add-model-and-merge.sh` merges on that number) and on mean recovery
      # collapsing below its floor. The tier classifier fails when it stops telling a pricing tier
      # from a model in either direction — too greedy and a real model silently stops being reported.
      # Neither needs a network or a key.
      - name: Replay the evidence counter and the tier classifier against known cases
        run: |
          node --experimental-strip-types scripts/lib/upstream-evidence.mjs --self-test
          node scripts/aa-new-models.mjs --self-test

      # A measurement window only ever pays off in a future it prevents: with it in place today,
      # `npm run ingest` writes a byte-identical file, so nothing else in this workflow can tell it
      # from a no-op. This asserts it in both directions on the real alias config, and pins the
      # undated-row hole as a decision rather than letting somebody tighten it into a silent loss
      # of half a record's evidence.
      - name: Replay the record measurement windows
        run: node scripts/lib/archive.mjs --self-test

      - name: Build production application
        run: npm run build

      # The one check here whose failure costs the domain rather than a number. A Beijing-filed site
      # must display its ICP filing on every route it serves (§6). That was verified by hand once, on
      # 2026-08-10, and then had no regression net at all — while 公安联网备案 lands around 2026-09-09
      # and will edit exactly that footer. It reads the prerendered HTML this build just wrote,
      # because the question is not "does the component exist" but "did the string reach the routes":
      # a route that stops using the root layout loses the footer and nothing else would notice.
      - name: Assert the ICP filing reached every prerendered route
        run: npm run check:beian

      # `test:sites` existed and ran nowhere. Measured 2026-08-11: the whole repository referenced it
      # exactly once, in its own package.json definition — not CI, not the daily job, not a document.
      # It is the test that asserts the root layout still renders its metadata after two sites were
      # merged into one repository, which is precisely the thing a personal-site edit can break from
      # the other route. The reason it rotted is worth keeping: `build:sites` needs GNU `timeout`, so
      # it cannot run on the maintainer's macOS at all — an orphan nobody could have noticed locally.
      # Same shape as `check:mobile` before 2026-08-07, and the same fix.
      - name: Render the site through its own server bundle
        run: npm run test:sites

      # The phone contract, and the reason it is here rather than in the "run it locally" list it
      # lived in until 2026-08-07: it was the ONLY one of the seven contract commands not in CI, so
      # it was the only one that depended on somebody remembering. Six commands ran on every push
      # and the seventh ran when a person thought of it — on `/models`, the route whose table went
      # from 68 columns to 72 in a single day.
      #
      # It needs a browser and a server, which is what kept it out. Neither is expensive here:
      # ubuntu-latest ships Chrome, and the build this job already produced is what `next start`
      # serves. What it must NOT do is skip itself when something is missing. A layout check that
      # silently passes because Chrome was not found is worse than no layout check — it reports
      # green for a probe that never ran — so the lookup fails the job instead.
      #
      # Both routes are probed. `check-mobile` defaults to `/models` precisely because pointing it
      # at `/` would pass on the personal site while a phone regression sat one route over; the
      # same argument says to probe both rather than to pick one.
      - name: Probe the phone layout at 320 / 390 / 430
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::no Chrome on this runner — the phone probe cannot run, and a skipped layout check must not read as a passing one."
            exit 1
          fi
          export CHROME_PATH
          echo "Chrome: $CHROME_PATH"

          PORT=3111 npm run start:next > /tmp/next-start.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Bounded wait. Without the bound a server that never comes up hangs the job until the
          # 20-minute timeout and reports as a timeout rather than as a server that did not start.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3111/models && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://localhost:3111/models; then
            echo "::error::next start never answered on :3111"
            cat /tmp/next-start.log
            exit 1
          fi

          npm run check:mobile
          npm run check:mobile -- http://localhost:3111/

      # The one notification this project sends when everything is working. It fires on the event
      # the owner actually wants to know about — **the site gained a model** — and not on any of
      # the events that lead up to it: a board moving, a maker publishing a post, Artificial
      # Analysis measuring something new. Those used to be pushed and are now picked up by the
      # pipeline without a person, so notifying on them only taught the habit of not opening the
      # notification. It lives here rather than in the daily job because a catalog record can land
      # from any direction — the attribution gate, the scheduled agent, or a hand-merged pull
      # request — and every one of them ends in a push to main.
      - name: Tell WeChat when the site gains a model
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          node scripts/describe-change.mjs HEAD^ > change.md || exit 0
          models="$(sed -n 's/.*<!-- new-models: \(.*\) -->.*/\1/p' change.md)"
          [ -n "$models" ] || { echo "No catalog record was added in this push."; exit 0; }
          {
            echo "站上新增模型:${models}"
            echo
            sed '/^<!--/d' change.md
            echo
            echo "数字看着不对就说一声,回滚是一个 revert 的事。"
          } | node scripts/notify-pushplus.mjs "观测台 · 新增模型"

      # The other half of the same rule, and the more urgent one. `AGENTS.md` states plainly that
      # **EdgeOne publishes on merge regardless of what CI said** — so a red check on `main` is not
      # a build waiting to be fixed, it is a site that is already live with a contract that is
      # failing. Nothing reported that. A red run sat in the Actions tab and the four notifications
      # this project sends are all about other events.
      #
      # It fires only on `main`, and only on a push. A pull request going red is a pull request
      # doing its job and belongs to whoever opened it; this is about the published board.
      #
      # `if: failure()` runs when an earlier step in this job failed, which is exactly the set of
      # events worth naming: lint, the archive-drift guard, any of the three data checks, the
      # attribution backtest, or the build.
      - name: Tell WeChat when main goes red
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          {
            echo "**main 上的检查是红的**,而 EdgeOne 合并即发布、不看 CI——所以站已经是这个状态了。"
            echo
            echo "提交:\`${{ github.sha }}\`"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "红的是哪一项去 run 里看。回滚是一个 revert 的事。"
          } | node scripts/notify-pushplus.mjs "⚠ 观测台 · main 检查变红"
