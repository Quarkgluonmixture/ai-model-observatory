name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, data contract, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rebuild observations from the archive
        run: npm run ingest

      - name: Fail if the generated observations drift from the archive
        run: git diff --exit-code app/observations.generated.ts

      - name: Validate benchmark data contract
        run: npm run check:data

      - name: Audit model catalog against the source archive
        run: npm run check:models

      - name: Fail on a quoted price that has outlived its published end date
        run: npm run check:prices

      # The attribution gate decides which model a published string belongs to, unattended. Its
      # test set is the decisions a human already made: a rule change that starts contradicting
      # one of them, or that starts mapping a string somebody deliberately refused, fails here
      # rather than shipping a wrong score under the right model's name.
      - name: Replay the attribution gate against every human decision
        run: npm run propose:attribution -- --backtest

      - name: Build production application
        run: npm run build
