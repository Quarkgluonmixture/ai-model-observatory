# Artificial Analysis, on demand.
#
# AA is `versioning: "manual"` and deliberately absent from the daily refresh: it re-measures
# speed and latency continuously, so a scheduled rewrite would turn `check:models` red every time
# a number drifted, and a check that is always red is a check nobody reads.
#
# But "not daily" was being read as "not automated", and the practical effect was that adding a
# model required somebody to sit at a machine that had AA_API_KEY in its environment and run the
# fetch by hand. The key is already a repository secret. So this runs the same fetch here, on
# request, and opens a pull request with it.
#
# Changed 2026-09-04: it still opens the pull request, and now it merges it too when nothing about
# the result needs a person.
#
# What used to sit here was "reconciling a red `check:models` — deciding whether the catalog or the
# source is stale — is the reviewer's job". That was true of the decision and false of the work.
# The decision had already been taken, twice, by the same argument each time (PR #114, PR #121):
# for `speed` and `latency`, the archive row was written by a script from the source minutes
# earlier and the catalog is a copy of an older run, so the catalog is the stale side by
# construction. What the reviewer was actually doing was typing twenty numbers across.
#
# So `scripts/reconcile-aa.mjs` types them, refuses every other field, and `check:models` becomes
# the gate it was always shaped like. A red one now means the reconciler refused something, and a
# refusal is the request for a person — the only one on this path.
name: Refresh Artificial Analysis

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Re-read AA and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Without the key this is a no-op that says so, rather than a failure: the same contract
      # every other AA-touching step in this repository follows.
      - name: Re-read Artificial Analysis
        id: fetch
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          if [ -z "${AA_API_KEY:-}" ]; then
            echo "::warning::AA_API_KEY is not set; nothing to refresh."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/fetch-source.mjs aa | tee fetch.log

      - name: Rebuild the observation store
        if: steps.fetch.outputs.skipped != '1'
        run: npm run ingest

      - name: Stop if nothing moved
        if: steps.fetch.outputs.skipped != '1'
        id: diff
        run: |
          if [ -z "$(git diff --name-only)" ]; then
            echo "AA has not re-measured anything since the archive was written." >> "$GITHUB_STEP_SUMMARY"
            echo "unchanged=1" >> "$GITHUB_OUTPUT"
          fi

      # The step that used to be a person editing app/model-data.ts by hand, twice, with the same
      # argument each time. A re-measured `speed` or `latency` is copied into the catalog record
      # that quotes it; every other kind of disagreement is refused and left for a human, and one
      # refusal stops the whole write. The reasoning, and why the line sits between `latency` and
      # `intelligence`, is in the script's header.
      - name: Reconcile the catalog with the re-measured archive
        if: steps.fetch.outputs.skipped != '1' && steps.diff.outputs.unchanged != '1'
        id: reconcile
        run: |
          node scripts/reconcile-aa.mjs --write | tee reconcile.md
          sed -n 's/.*<!-- aa-reconciled: \([0-9]*\) -->.*/reconciled=\1/p' reconcile.md >> "$GITHUB_OUTPUT"
          sed -n 's/.*<!-- aa-escalated: \([0-9]*\) -->.*/escalated=\1/p' reconcile.md >> "$GITHUB_OUTPUT"
          cat reconcile.md >> "$GITHUB_STEP_SUMMARY"

      # No published observation cell should move on an AA refresh: this batch carries operating
      # parameters, not benchmark rows. Read rather than assumed, because it is the cheap backstop
      # for the day that stops being true.
      - name: Describe the change
        if: steps.fetch.outputs.skipped != '1' && steps.diff.outputs.unchanged != '1'
        id: describe
        run: |
          node scripts/describe-change.mjs > change.md || echo "(could not describe the change)" > change.md
          # `observation-cells-moved`, NOT `changed-cells … moved`. The second counts catalog
          # numbers too, and this branch exists to move catalog numbers — reading it here would
          # refuse every successful reconcile. See the marker's comment in describe-change.mjs.
          sed -n 's/.*<!-- observation-cells-moved: \([0-9]*\) -->.*/moved=\1/p' change.md >> "$GITHUB_OUTPUT"

      # Now a gate, where it used to be a report — because the reconcile step above removed the
      # reason it could not be one. `check:models` was expected to be red here: it was comparing a
      # catalog nobody had updated against an archive re-read minutes earlier, and that is the
      # conversation the pull request existed to start. The conversation now has a scripted answer
      # for the two fields where there was only ever one answer, so a red `check:models` after
      # reconciling means something the script refused — which is exactly when a person is wanted.
      #
      # `check:prices` stays reported-only, for the reason already ratified for the daily refresh
      # on 2026-08-19: nothing on this path writes a `priceTerms` block or a `MODELS[].price`, so
      # this diff cannot change that verdict, and gating on it strands an archive refresh behind
      # somebody else's price decision. `ci.yml` still fails on it. See GOTCHAS 41.
      - name: Run the contract
        if: steps.fetch.outputs.skipped != '1' && steps.diff.outputs.unchanged != '1'
        id: contract
        run: |
          # Redirect into the file and `cat` it afterwards; never `{ … } | tee`. A brace group on
          # the left of a pipe runs in a subshell, so every `green=no` set inside one is discarded
          # when it exits — the verdict would come out `yes` however red the checks were. Plain
          # redirection does not fork, so the assignments survive. This is the same shape
          # scripts/attribute-and-merge.sh uses, and the same family of mistake as the missing
          # `pipefail` that let 4239916 commit a red check:models to main on 2026-08-03.
          green=yes
          set +e
          {
            npm run --silent lint && echo "lint ok"
            npm run --silent check:data || { echo "check:data FAILED"; green=no; }
            npm run --silent check:models || { echo "check:models FAILED — a catalog value disagrees with the re-measured source and reconcile-aa refused it; decide which one is stale"; green=no; }
            npm run --silent check:prices || echo "check:prices is red — reported, not gating this refresh; ci.yml still fails on it"
            npm run --silent build > /dev/null && echo "build ok" || { echo "build FAILED"; green=no; }
          } > checks.txt 2>&1
          set -e
          cat checks.txt
          echo "green=$green" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.fetch.outputs.skipped != '1' && steps.diff.outputs.unchanged != '1'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          bash scripts/open-aa-pr.sh checks.txt

      # The pull request still opens first, every time, and it is still the record. What changed on
      # 2026-09-04 is that it no longer has to be read: four conditions decide, and they are the
      # same ones the attribution and new-model gates already merge under, plus the one this branch
      # needs of its own.
      #
      #   green       the full contract passes AFTER reconciling — so `check:models`, the check that
      #               was expected to be red here, is now the gate it was always shaped like
      #   escalated   the reconciler refused nothing. A refusal IS the request for a person, and it
      #               is the only thing on this path that can be one
      #   moved       no published observation cell changed. An AA parameter batch should not move
      #               one; if it does, that is a different event and it is the owner's
      #   handsoff    somebody is already deciding on this pull request — commented, reviewed, or
      #               committed to the branch. Then it is theirs and this run never touched it
      #
      # Why this is allowed at all, stated rather than assumed: the merge is not "trust the diff",
      # it is that this branch's only two possible contents are an archive row a script re-read
      # from the source, and a catalog value copied from that row. Neither carries a decision. The
      # decisions — which model a string is, whether a record should exist, which reading a ranked
      # field should publish — all live on other branches, behind other gates, and reconcile-aa
      # refuses every one of them.
      - name: Merge it when nothing about the result needs a person
        if: >-
          steps.fetch.outputs.skipped != '1' && steps.diff.outputs.unchanged != '1' &&
          steps.pr.outputs.handsoff != 'yes' &&
          steps.contract.outputs.green == 'yes' &&
          steps.reconcile.outputs.escalated == '0' &&
          steps.describe.outputs.moved == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge auto/refresh-aa --merge --delete-branch
          echo "Merged: contract green, ${{ steps.reconcile.outputs.reconciled }} value(s) reconciled, nothing escalated, no published cell moved." >> "$GITHUB_STEP_SUMMARY"

      # Said out loud only when it did NOT merge, and only about why. A pull request that merges
      # itself is not news; one that stopped is the queue this repository is trying not to grow.
      - name: Say why it is waiting
        if: >-
          steps.fetch.outputs.skipped != '1' && steps.diff.outputs.unchanged != '1' &&
          steps.pr.outputs.handsoff != 'yes' &&
          !(steps.contract.outputs.green == 'yes' && steps.reconcile.outputs.escalated == '0' && steps.describe.outputs.moved == '0')
        run: |
          {
            echo "### Left open for a person"
            echo
            echo "- contract green: \`${{ steps.contract.outputs.green }}\`"
            echo "- reconciler escalated: \`${{ steps.reconcile.outputs.escalated }}\`"
            echo "- published cells moved: \`${{ steps.describe.outputs.moved }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # This workflow is dispatched by upstream.yml, which fires and forgets — `gh workflow run`
      # returns as soon as the dispatch is accepted and nothing ever reads the outcome. So until
      # now the only failure here that could speak was the one the last step catches itself: a
      # pull request that would not open. Everything earlier — the fetch, `npm run ingest`, the
      # contract — failed into an empty room.
      #
      # 2026-08-07 came within one step of demonstrating it. The `gh: Argument list too long`
      # failure happened to land inside open-aa-pr.sh's own fallback, which pushed a correct
      # notification. Had the same body killed `npm run ingest` instead, the run would have gone
      # red and nobody would have known until somebody wondered why AA had not refreshed in a week.
      #
      # Not a new notification category: "something is broken" is one of the two this channel is
      # reserved for, and this is the same event as the message below it — just the half that could
      # not previously reach anyone.
      - name: Say so if this failed
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          {
            echo "AA 刷新这次跑失败了,**没有**开出 PR,归档也没有变。"
            echo
            echo "上一次成功的归档还在,站上的数字没有受影响——这条只是说这次自动重读没成功。"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | node scripts/notify-pushplus.mjs "⚠ 观测台 · AA 刷新失败"
